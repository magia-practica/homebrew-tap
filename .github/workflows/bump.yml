# Updates Formula/nodimargo.rb to a new release.
#
# Runs when the nodiMargo release workflow sends a repository_dispatch event:
#   gh api repos/magia-practica/homebrew-tap/dispatches \
#     -f event_type=nodimargo-release -f 'client_payload[version]=0.4.1'
# or by hand from the Actions tab.
name: bump nodimargo

on:
  repository_dispatch:
    types: [nodimargo-release]
  workflow_dispatch:
    inputs:
      version:
        description: Version without the leading v (e.g. 0.4.1)
        required: true

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.client_payload.version || inputs.version }}
      FORMULA: Formula/nodimargo.rb
      BASE: https://github.com/magia-practica/nodimargo-release/releases/download
    steps:
      - uses: actions/checkout@v4

      - name: Update version and checksums
        run: |
          set -euo pipefail
          sed -i -E "s/^  version \".*\"/  version \"${VERSION}\"/" "$FORMULA"

          # Every url line in the formula, in order, with its sha256 on the next line.
          grep -oE '#\{base\}/[^"]+' "$FORMULA" | sed 's/#{base}\///' | while read -r asset; do
            file="${asset//\#\{version\}/$VERSION}"
            curl -fsSL -o asset.tmp "${BASE}/v${VERSION}/${file}"
            sum=$(sha256sum asset.tmp | cut -d' ' -f1)
            awk -v a="$asset" -v s="$sum" '
              index($0, a) { print; getline; sub(/"[^"]*"/, "\"" s "\""); }
              { print }
            ' "$FORMULA" > formula.tmp && mv formula.tmp "$FORMULA"
          done
          rm -f asset.tmp

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "nodimargo ${VERSION}"
          git push
